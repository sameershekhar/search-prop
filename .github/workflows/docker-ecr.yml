name: Build and Push SearchProp Images

on:
  push:
    branches:
      - main-aws

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  BACKEND_REPOSITORY: searchprop-backend
  FRONTEND_REPOSITORY: searchprop-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:latest \
            ./backend

          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest \
            ./frontend

          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest